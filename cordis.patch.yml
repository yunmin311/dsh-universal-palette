# cordis.patch.yml — DSH Web profile patch for dsh-universal-palette
#
# Verified against exact upstream SHA:
#   deepseek-ai/deepseek-harness @ 76fda729799fe9b3848dbe2c211d4b231032b81e
#   @deepseek-ai/dsh root package version: 0.1.2-rc.1
#
# This patch is consumed by `dsh plugin --profile web add .` and composed
# on top of the active profile's `cordis.patch.yml`. Rows here override
# shipped rows by id; new rows are added via the `insert` form (the same
# pattern the upstream `dsh-web-app` bundle uses for its browser
# roster at `packages/bundle/web-app/cordis.patch.yml`).
#
# Two things this patch does:
#
#   1. Overrides the shipped `session-query-sqlite` row to enable a
#      persistent FTS path and `openAt: first-search`. The shipped
#      default in the base bundle is `openAt: never` (see
#      `packages/bundle/base/cordis.patch.yml` at the locked SHA),
#      which would mean Conversation Hits are empty out of the box.
#      Universal Palette requires Conversation Hits as a release hard
#      prerequisite.
#
#   2. Inserts the `dsh-universal-palette` row into the web composition
#      so the browser roster sees it. The row carries the bundle's
#      `name` (which is the npm package name Cordis uses to resolve
#      the bundle) and the `dsh.client` declaration from
#      `package.json`.

# Full-text session search is opt-in (the base row's `openAt: never`).
# This restatement keeps the Web values on one durable per-home index
# opened on the first search.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

# The plugin row. Inserted into the active composition. The browser
# half's `dsh.client` declaration in `package.json` advertises
# `platform: 'web'` and the `inject` edge set the activator reads at
# composition time.
- insert:
    - id: dsh-universal-palette
      name: '@yunmin311/dsh-universal-palette'
